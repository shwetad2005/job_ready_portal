spring.application.name=backend

# database settings

spring.datasource.url=jdbc:mysql://localhost:3306/job_ready_portal
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# hibernate related setting
# =============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.protperties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Uploaded course materials are stored outside the application source tree.
app.course-upload-dir=${COURSE_UPLOAD_DIR:uploads/courses}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB


